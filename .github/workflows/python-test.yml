name: Python application test

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - stage
      - prod

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout rep
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: pytest test.py